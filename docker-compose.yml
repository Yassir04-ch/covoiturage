services:
  postgres:
    image: postgres:17
    container_name: covoiturage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: covoiturage_db
      POSTGRES_USER: yassirch
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - covoiturage_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yassirch -d covoiturage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  covoiturage_data:
